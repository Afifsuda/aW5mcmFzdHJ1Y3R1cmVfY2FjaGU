name: Deploy Cloudflare Voice Relay

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'relay_cf/**'
      - '.github/workflows/deploy-relay.yml'

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Cloudflare API Token
        id: check_token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "CLOUDFLARE_API_TOKEN belum diset di GitHub Secrets. Melewati deploy otomatis."
          fi

      - name: Deploy Worker via Wrangler
        if: steps.check_token.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: relay_cf
          command: deploy
