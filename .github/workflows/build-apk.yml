name: Build Flutter APK (arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Flutter arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:"

      - name: Ensure Consistent Signing Keystore
        run: |
          if [ ! -f "android/app/release.keystore" ]; then
            echo "Membuat release keystore tetap agar tanda tangan APK konsisten selamanya..."
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=Afifsuda, OU=App, O=Dev, L=Jakarta, S=Jakarta, C=ID"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/release.keystore
            git commit -m "chore: persist permanent release keystore [skip ci]" || true
            git push origin main || true
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Get Dependencies & Inject Node.js Mobile Libnode
        run: |
          flutter pub get
          
          NODE_FLUTTER_PATH=$(find $HOME/.pub-cache -type d -name "node_flutter-*" | head -n 1)
          echo "Found node_flutter at: $NODE_FLUTTER_PATH"
          
          if [ -n "$NODE_FLUTTER_PATH" ]; then
            mkdir -p "$NODE_FLUTTER_PATH/android/libnode"
            echo "Mengunduh prebuilt resmi Node.js Mobile Android..."
            curl -sSL "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip" -o nodejs-mobile.zip
            unzip -q nodejs-mobile.zip -d "$NODE_FLUTTER_PATH/android/libnode/"
            rm -f nodejs-mobile.zip
            echo "libnode terpasang:"
            ls -la "$NODE_FLUTTER_PATH/android/libnode/bin/" || true
          fi

      - name: Package Standalone 9Router Runtime Asset
        run: |
          mkdir -p /tmp/9router_pack
          cd /tmp/9router_pack
          npm init -y
          npm install 9router --omit=dev --no-audit --no-fund
          zip -qr "$GITHUB_WORKSPACE/9router-runtime.zip" node_modules package.json
          cd "$GITHUB_WORKSPACE"
          echo "Ukuran file 9router-runtime.zip: $(ls -lh 9router-runtime.zip | awk '{print $5}')"

      - name: Build APK (Khusus arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK ke GitHub Releases (Tanpa GitHub Storage)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          RUNTIME_PATH="9router-runtime.zip"
          TAG="v1.0.${{ github.run_number }}"
          
          echo "Ukuran file APK: $(ls -lh $APK_PATH | awk '{print $5}')"
          echo "Ukuran file Runtime: $(ls -lh $RUNTIME_PATH | awk '{print $5}')"
          
          # Upload langsung ke GitHub Releases menggunakan GitHub CLI
          gh release create "$TAG" "$APK_PATH" "$RUNTIME_PATH" \
            --title "Satellite Map Canvas arm64 - Build #${{ github.run_number }}" \
            --notes "APK Mandiri (~25MB) dengan native Node.js Mobile Engine + aset runtime 9Router terpisah."
